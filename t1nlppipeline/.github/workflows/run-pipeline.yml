name: Run NLP Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data_loading_pipeline/**"
      - "qa_*.json.gz"
      - ".github/workflows/run-pipeline.yml"
  pull_request:
    branches:
      - main

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data_loading_pipeline/pyproject.toml

      - name: Install project
        working-directory: data_loading_pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: data_loading_pipeline
        run: |
          pytest -q

      - name: Inspect repository dataset
        working-directory: data_loading_pipeline
        run: |
          python -m data_pipeline.cli .. \
            --inspect-only \
            --sample-size 3

      - name: Run pipeline on repository dataset
        working-directory: data_loading_pipeline
        run: |
          python -m data_pipeline.cli .. \
            --batch-size 1000 \
            --limit 20
