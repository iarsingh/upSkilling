name: Run NLP Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "t1nlppipeline/data_loading_pipeline/**"
      - "t1nlppipeline/qa_*.json.gz"
      - ".github/workflows/run-pipeline.yml"

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        working-directory: t1nlppipeline/data_loading_pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: t1nlppipeline/data_loading_pipeline
        run: pytest -q

      - name: Inspect repository dataset
        working-directory: t1nlppipeline/data_loading_pipeline
        run: |
          python -m data_pipeline.cli .. \
            --inspect-only \
            --sample-size 3

      - name: Run pipeline
        working-directory: t1nlppipeline/data_loading_pipeline
        run: |
          python -m data_pipeline.cli .. \
            --batch-size 1000 \
            --limit 20