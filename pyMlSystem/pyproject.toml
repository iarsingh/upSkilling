[project]
name = "incident-ops"
version = "0.1.0"
description = "Local-first incident triage with FastAPI, MLflow, and an explicit human review workflow"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pgvector==0.5.0",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "mlflow==3.16.1",
  "openai==3.19.2",
  "prometheus-client==0.26.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0"
]

[project.scripts]
incident-train = "incident_ops.train:main"
incident-seed = "incident_ops.seed:main"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.8", "pytest-cov==7.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]
