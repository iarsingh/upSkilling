[project]
name = "ml-labs"
version = "0.1.0"
description = "Local labs for NumPy, data-science quality gates, MLOps training/monitoring, and FastAPI model serving. Synthetic data only; not a production deployment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.7",
  "joblib>=1.4",
  "httpx>=0.27",
]

[project.scripts]
ml-labs = "ml_labs.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_labs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
