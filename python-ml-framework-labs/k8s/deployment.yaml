# Local kind/minikube sketch only. This repository does not apply to a customer cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-labs-api
  labels:
    app: ml-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-labs
  template:
    metadata:
      labels:
        app: ml-labs
    spec:
      containers:
        - name: api
          image: ml-labs:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ml-labs-api
spec:
  selector:
    app: ml-labs
  ports:
    - port: 8080
      targetPort: 8080
