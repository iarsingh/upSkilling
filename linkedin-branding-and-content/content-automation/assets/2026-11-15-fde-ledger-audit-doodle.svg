<defs>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="8"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
 <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="4" result="warp"/><feDisplacementMap in="SourceGraphic" in2="warp" scale="3"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M1 1L10 4 1 8" fill="none" stroke="#172033" stroke-width="2" stroke-linecap="round"/></marker>
 <style>.ink{fill:none;stroke:#172033;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:5}.eyebrow{font-family:"Comic Sans MS","Chalkboard SE",sans-serif;font-size:20px;font-weight:700;fill:#0f766e;letter-spacing:1.8px}.title{font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-size:48px;font-weight:900;fill:#172033}.note{font-family:"Comic Sans MS","Chalkboard SE",Arial,sans-serif;font-size:24px;font-weight:700;fill:#334155}.detail{font-family:"Comic Sans MS","Chalkboard SE",Arial,sans-serif;font-size:17px;font-weight:700;fill:#334155}.card{stroke:#172033;stroke-width:4;filter:url(#wobble)}.step{font-family:"Comic Sans MS",Arial,sans-serif;font-size:15px;font-weight:700;fill:#0f766e}.cardText{font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-size:16px;font-weight:800;fill:#172033}.scribble{fill:none;stroke:#172033;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 6}.footer{font-family:"Comic Sans MS","Chalkboard SE",Arial,sans-serif;font-size:18px;font-weight:700;fill:#475569}</style>
