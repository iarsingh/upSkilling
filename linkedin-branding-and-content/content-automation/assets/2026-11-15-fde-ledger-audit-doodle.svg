<path d="M53 75q30-30 64 0m-42-25 24 39" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/><text x="72" y="104" class="eyebrow">FDE SCENARIO</text><text x="72" y="151" class="title" transform="rotate(-0.3 72 151)">Keep the exception, not the</text>
<text x="72" y="209" class="title" transform="rotate(0.35 72 209)">provider payload</text>
