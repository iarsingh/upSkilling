<g transform="rotate(0.8 311 506)"><rect x="248" y="459" width="126" height="94" rx="10" fill="#fff" class="card"/><text x="265" y="486" class="step">02</text><text x="311" y="523" class="cardText" text-anchor="middle">Keep the id</text></g><path d="M380 508q19 -12 38 1" class="scribble" marker-end="url(#arrow)"/>
<g transform="rotate(-0.5 489 490)"><rect x="426" y="443" width="126" height="94" rx="10" fill="#ccfbf1" class="card"/><text x="443" y="470" class="step">03</text><text x="489" y="507" class="cardText" text-anchor="middle">Keep result</text></g><path d="M558 492q19 12 38 1" class="scribble" marker-end="url(#arrow)"/>
