  <text x="64" y="148" fill="#f4f6f8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700">GenAI vs Agentic</text>
  <text x="64" y="198" fill="#c5d0db" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24">What actually changes when the model can act</text>

  <rect x="64" y="260" width="952" height="160" fill="#1a222c" stroke="#3d4f63"/>
  <text x="88" y="310" fill="#8b9aab" font-size="20" font-family="ui-sans-serif, system-ui, sans-serif">GENAI</text>
  <text x="88" y="360" fill="#f4f6f8" font-size="28" font-family="ui-sans-serif, system-ui, sans-serif">Prompt  ’  LLM  ’  Response</text>

  <rect x="64" y="448" width="952" height="160" fill="#1a222c" stroke="#5b8def"/>
  <text x="88" y="498" fill="#5b8def" font-size="20" font-family="ui-sans-serif, system-ui, sans-serif">AGENTIC</text>
  <text x="88" y="548" fill="#f4f6f8" font-size="26" font-family="ui-sans-serif, system-ui, sans-serif">Goal ’ Reason ’ Plan ’ Tools ’ Action ’ Validate</text>

  <text x="64" y="680" fill="#c5d0db" font-size="22" font-family="ui-sans-serif, system-ui, sans-serif">Then you are shipping a control plane:</text>
  <text x="64" y="730" fill="#f4f6f8" font-size="22" font-family="ui-sans-serif, system-ui, sans-serif">Identity · APIs · Memory · Retries · Traces · Human gates · Policy</text>
  <text x="64" y="800" fill="#f4f6f8" font-size="24" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Maximum autonomy is not the goal.</text>
  <text x="64" y="848" fill="#f4f6f8" font-size="24" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Appropriate autonomy is.</text>
  <text x="64" y="980" fill="#8b9aab" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif">Akhilesh Ranjan Singh  ·  labs, not live customer agents  ·  github.com/iarsingh</text>
