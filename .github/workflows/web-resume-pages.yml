name: Deploy Static Project Showcase

on:
  push:
    branches:
      - main
    paths:
      - "github-pages/**"
      - "akhilesh-ranjan-portfolio/**"
      - "web-resume/**"
      - "resume-web-builder/**"
      - "startup-scaffold/cloudops-copilot-online/**"
      - ".github/workflows/web-resume-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: akhilesh-ranjan-portfolio/package-lock.json

      - name: Build portfolio
        working-directory: akhilesh-ranjan-portfolio
        run: |
          npm ci
          npm run build -- --base=/upSkilling/portfolio/

      - name: Assemble Pages site
        run: |
          mkdir -p _site/portfolio _site/web-resume _site/resume-builder _site/cloudops-copilot
          cp github-pages/index.html _site/index.html
          cp -R akhilesh-ranjan-portfolio/dist/. _site/portfolio/
          cp web-resume/index.html web-resume/favicon.svg web-resume/og-card.svg web-resume/robots.txt web-resume/sitemap.xml _site/web-resume/
          cp resume-web-builder/index.html resume-web-builder/styles.css _site/resume-builder/
          cp -R resume-web-builder/js _site/resume-builder/js
          cp startup-scaffold/cloudops-copilot-online/index.html startup-scaffold/cloudops-copilot-online/styles.css startup-scaffold/cloudops-copilot-online/app.js _site/cloudops-copilot/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
