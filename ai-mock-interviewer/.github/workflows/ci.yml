name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: npm ci
      - run: npm run check:release
      - run: python -m pip install -r requirements-docs.txt
      - run: npm run test:documents
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate example production configuration
        run: npm run check:production
        env:
          OFFLINE_ONLY: "1"
          SESSION_SECRET: ci-only-production-readiness-secret-123456
          DATABASE_URL: postgresql://ci:ci@database.invalid:5432/ci
      - name: Build production container
        run: docker build -t ai-mock-interviewer:ci .
