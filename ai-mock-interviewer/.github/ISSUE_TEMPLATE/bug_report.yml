name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use SECURITY.md. Remove credentials and personal data from logs."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, run mode, and commit/version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
